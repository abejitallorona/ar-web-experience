<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Con un marcador · AR Combo</title>
  <link rel="icon" href="img/icon.png">
  <link rel="stylesheet" href="style.css">
  <!-- A-Frame 1.3.0 + aframe-extras 6.1.1 + AR.js 3.4.5 (copias locales) -->
  <script src="lib/aframe.min.js"></script>
  <script src="lib/aframe-extras.min.js"></script>
  <script src="lib/aframe-ar.js"></script>
  <style>
    /* El fondo va solo en html: si body tuviera fondo, taparía el video de la cámara (AR.js lo pone con z-index negativo) */
    html { background: #000; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body.cam { background: transparent; }
  </style>
</head>
<body class="cam">
  <div class="intro" id="intro">
    <div class="card cut">
      <h1>Apunta a un marcador</h1>
      <p>Imprime uno de los dos marcadores o ábrelo en otra pantalla. Cuando la cámara lo vea, la bandeja aparece encima.</p>
      <div class="markers">
        <figure><img src="data/hiro.png" alt="Marcador Hiro">Hiro</figure>
        <figure><img src="data/marcador_combo.png" alt="Marcador Combo">Combo</figure>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn cut" id="go"><span class="gem"></span>Abrir cámara</button>
        <a class="btn ghost cut" href="data/marcadores_imprimir.pdf" target="_blank">Imprimir</a>
      </div>
    </div>
  </div>

  <div class="cam-ui" id="ui">
    <header class="bar"><a class="back cut" href="index.html">‹ Inicio</a></header>
    <div class="reticle" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="pill cut" id="status" role="status">Buscando el marcador…</div>
  </div>

  <!-- Dos marcadores a la vez: Hiro (clásico) y el marcador propio "Combo" (data/patt.combo). Rutas locales en data/. -->
  <a-scene embedded vr-mode-ui="enabled: false"
    loading-screen="dotsColor: #F2B731; backgroundColor: #F2EEE9"
    renderer="logarithmicDepthBuffer: true; colorManagement: true; antialias: true"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false; cameraParametersUrl: data/camera_para.dat; patternRatio: 0.5">
    <a-assets timeout="20000"><a-asset-item id="combo" src="models/McDonalds_AR_Combo.glb"></a-asset-item></a-assets>
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; color: #fff4e0; intensity: 0.85" position="-1 3 2"></a-entity>

    <!-- 1 unidad = ancho del marcador. La bandeja mide 0.46 m; ×2 queda casi del ancho del marcador. -->
    <a-marker class="mk" type="pattern" url="data/patt.hiro" smooth="true" smoothCount="8" smoothTolerance="0.01" smoothThreshold="2" emitevents="true">
      <a-entity class="pop" scale="2 2 2" animation__pop="property: scale; from: 0.3 0.3 0.3; to: 2 2 2; dur: 600; easing: easeOutBack; startEvents: pop">
        <a-entity gltf-model="#combo" animation-mixer="loop: repeat"></a-entity>
      </a-entity>
    </a-marker>
    <a-marker class="mk" type="pattern" url="data/patt.combo" smooth="true" smoothCount="8" smoothTolerance="0.01" smoothThreshold="2" emitevents="true">
      <a-entity class="pop" scale="2 2 2" animation__pop="property: scale; from: 0.3 0.3 0.3; to: 2 2 2; dur: 600; easing: easeOutBack; startEvents: pop">
        <a-entity gltf-model="#combo" animation-mixer="loop: repeat"></a-entity>
      </a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const ui = document.getElementById('ui'), status = document.getElementById('status');
    let audio = null;
    // Sonido corto de "moneda" generado en el navegador (sin archivos)
    function coin() {
      if (!audio) return;
      const t = audio.currentTime;
      [[988, 0], [1319, 0.08]].forEach(([f, d]) => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.14, t + d + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d + (d ? 0.32 : 0.09));
        o.connect(g).connect(audio.destination); o.start(t + d); o.stop(t + d + 0.4);
      });
      if (navigator.vibrate) navigator.vibrate(18);
    }
    document.getElementById('go').addEventListener('click', () => {
      try { audio = new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
      document.getElementById('intro').classList.add('hidden');
    });
    const visible = new Set();
    document.querySelectorAll('.mk').forEach(mk => {
      let lostAt = 0;
      mk.addEventListener('markerFound', () => {
        visible.add(mk);
        if (!lostAt || performance.now() - lostAt > 1000) { mk.querySelector('.pop').emit('pop'); coin(); }
        ui.classList.add('found'); status.textContent = 'Ahí está tu combo. Gira el marcador para verlo por todos lados';
      });
      mk.addEventListener('markerLost', () => {
        visible.delete(mk); lostAt = performance.now();
        if (!visible.size) { ui.classList.remove('found'); status.textContent = 'Buscando el marcador…'; }
      });
    });
    document.querySelectorAll('[gltf-model]').forEach(m => m.addEventListener('model-error', () => {
      status.textContent = 'No se pudo cargar el modelo. Revisa la carpeta models/';
    }));
  </script>
</body>
</html>
